name: Update company price data

on:
  schedule:
    # Runs once daily at 06:00 UTC — price/financial data doesn't need the
    # 6-hour freshness that news does.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest prices
        run: python scripts/fetch_prices.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # update-data.yml (or a manual push) can land on main between
          # this job's checkout and its push, which rejects the push
          # outright — git push never auto-retries. On rejection, drop this
          # commit, fast-forward to the new remote HEAD, and regenerate the
          # data fresh on top of it rather than trying to merge/rebase two
          # independently-regenerated JSON files.
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            git add public/data/companies.json
            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "chore: refresh company price data"
            if git push; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt/$max_attempts — resyncing and regenerating."
            git reset --hard HEAD~1
            git pull --ff-only origin main
            python scripts/fetch_prices.py
            attempt=$((attempt + 1))
          done

          echo "::error::Failed to push after $max_attempts attempts."
          exit 1
